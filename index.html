<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N1备考打卡系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 2.5em;
            color: #333;
            font-weight: bold;
        }

        .stat-card .progress-bar {
            margin-top: 10px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-card .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls input, .controls select, .controls button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls input, .controls select {
            background: white;
            color: #333;
        }

        .controls button {
            background: #667eea;
            color: white;
            font-weight: bold;
            border: none;
        }

        .controls button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .date-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .date-navigation button {
            width: 50px;
            padding: 12px;
        }

        .current-date {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .schedule-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .schedule-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .schedule-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .schedule-header.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .schedule-content {
            padding: 20px;
        }

        .time-slot {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .time-slot:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .time-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .task-item.completed {
            background: #f0f9ff;
            border-left-color: #38ef7d;
            opacity: 0.8;
        }

        .task-item.completed .task-content {
            text-decoration: line-through;
            color: #999;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .task-content {
            flex: 1;
            cursor: pointer;
        }

        .task-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .task-description {
            color: #666;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .task-duration {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-top: 6px;
        }

        .guide-button {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .guide-button:hover {
            background: #764ba2;
        }

        .guide-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        .guide-modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .guide-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .guide-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .guide-content h3 {
            color: #764ba2;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .guide-content p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .guide-content ul, .guide-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .guide-content li {
            margin-bottom: 8px;
            color: #333;
            line-height: 1.6;
        }

        .guide-step {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .close-guide {
            float: right;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
        }

        .close-guide:hover {
            color: #333;
        }

        .daily-summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: bold;
            color: #667eea;
        }

        .summary-value {
            color: #333;
        }

        .weekend {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .weekend .schedule-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .schedule-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .controls input, .controls select, .controls button {
                width: 100%;
            }

            .guide-content {
                max-width: 90%;
                padding: 20px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 30px;
            opacity: 0.8;
        }

        .language-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .language-selector button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .language-selector button.active {
            background: white;
            color: #667eea;
        }

        .export-btn {
            background: #38ef7d !important;
        }

        .export-btn:hover {
            background: #11998e !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 N1备考打卡系统</h1>
            <p>坚持81天，通过N1考试！ 加油💪</p>
            <p style="font-size: 0.9em; margin-top: 10px;">考试日期: 2026年12月4日</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>总任务数</h3>
                <div class="number" id="totalTasks">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="totalProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>已完成</h3>
                <div class="number" id="completedTasks">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="completedProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>完成率</h3>
                <div class="number" id="completionRate">0%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="rateProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>连续完成天数</h3>
                <div class="number" id="consecutiveDays">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="consecutiveProgressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="date-navigation">
                <button onclick="previousDate()">← 前一天</button>
                <div>
                    <input type="date" id="dateSelector" onchange="selectDate()">
                    <div class="current-date" id="currentDateDisplay">今日</div>
                </div>
                <button onclick="nextDate()">后一天 →</button>
            </div>
            <button onclick="resetAll()" style="background: #ff6b6b; border-color: #ff6b6b;">🔄 重置所有</button>
            <button class="export-btn" onclick="exportData()">📊 导出数据</button>
        </div>

        <div class="schedule-container" id="scheduleContainer">
            <!-- 动态生成的日程卡片 -->
        </div>

        <div class="daily-summary">
            <h3 style="color: #667eea; margin-bottom: 15px;">📋 今日任务总结</h3>
            <div class="summary-row">
                <span class="summary-label">总任务数：</span>
                <span class="summary-value" id="todayTotalTasks">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">已完成：</span>
                <span class="summary-value" id="todayCompletedTasks">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">完成进度：</span>
                <span class="summary-value" id="todayProgress">0%</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">预计完成时间：</span>
                <span class="summary-value" id="estimatedTime">-</span>
            </div>
        </div>

        <div class="footer">
            <p>💡 每天坚持打卡，记录学习进度。你的努力终将开花结果！</p>
            <p>© N1备考打卡系统 - 祝你12月4日考试顺利通过！🎯</p>
        </div>
    </div>

    <!-- 指南弹窗 -->
    <div class="guide-modal" id="guideModal">
        <div class="guide-content">
            <span class="close-guide" onclick="closeGuide()">&times;</span>
            <div id="guideText"></div>
        </div>
    </div>

    <script>
        // 学习计划数据
        const scheduleData = {

        // 周末任务特殊处理

        // 生成日程卡片
        function generateSchedule(dateStr) {
            const scheduleContainer = document.getElementById('scheduleContainer');
            scheduleContainer.innerHTML = '';

            const data = scheduleData[dateStr];
            if (!data) {
                scheduleContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">此日期无计划数据</p>';
                return;
            }

            const date = new Date(dateStr);
            const dayOfWeek = date.getDay();
            const isWeekend = dayOfWeek === 6; // 周六

            let cardsToDisplay = data.cards;
            if (isWeekend && data.cards.length === 0) {
                cardsToDisplay = [weekendTasks];
            }

            cardsToDisplay.forEach((card, cardIndex) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `schedule-card ${isWeekend ? 'weekend' : ''}`;

                const headerDiv = document.createElement('div');
                headerDiv.className = `schedule-header ${data.cards.length > 0 ? '' : 'completed'}`;
                headerDiv.textContent = `${card.period}`;
                cardDiv.appendChild(headerDiv);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'schedule-content';

                // 添加标题
                const titleDiv = document.createElement('h3');
                titleDiv.style.color = '#667eea';
                titleDiv.style.marginBottom = '15px';
                titleDiv.textContent = card.title;
                contentDiv.appendChild(titleDiv);

                // 添加时长标签
                const durationSpan = document.createElement('span');
                durationSpan.className = 'task-duration';
                durationSpan.textContent = card.duration;
                contentDiv.appendChild(durationSpan);

                contentDiv.appendChild(document.createElement('br'));

                // 添加任务列表
                card.tasks.forEach((task, taskIndex) => {
                    const taskKey = `${dateStr}-${cardIndex}-${taskIndex}`;
                    const isCompleted = getTaskStatus(taskKey);

                    const taskItem = document.createElement('div');
                    taskItem.className = `task-item ${isCompleted ? 'completed' : ''}`;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'task-checkbox';
                    checkbox.checked = isCompleted;
                    checkbox.onchange = () => toggleTask(taskKey);

                    const taskContent = document.createElement('div');
                    taskContent.className = 'task-content';

                    const taskTitle = document.createElement('div');
                    taskTitle.className = 'task-title';
                    taskTitle.textContent = task.title;

                    const taskDesc = document.createElement('div');
                    taskDesc.className = 'task-description';
                    taskDesc.textContent = task.description;

                    taskContent.appendChild(taskTitle);
                    taskContent.appendChild(taskDesc);

                    if (task.guide) {
                        const guideBtn = document.createElement('button');
                        guideBtn.className = 'guide-button';
                        guideBtn.textContent = '📖 查看指南';
                        guideBtn.onclick = () => showGuide(task.guide);
                        taskContent.appendChild(guideBtn);
                    }

                    taskItem.appendChild(checkbox);
                    taskItem.appendChild(taskContent);
                    contentDiv.appendChild(taskItem);
                });

                cardDiv.appendChild(contentDiv);
                scheduleContainer.appendChild(cardDiv);
            });

            updateStats(dateStr);
        }

        // 任务状态管理
        function getTaskStatus(taskKey) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            return data[taskKey] || false;
        }

        function toggleTask(taskKey) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            data[taskKey] = !data[taskKey];
            localStorage.setItem('taskStatus', JSON.stringify(data));
            generateSchedule(currentDate);
        }

        function updateStats(dateStr) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            const scheduleContainer = document.getElementById('scheduleContainer');
            const checkboxes = scheduleContainer.querySelectorAll('.task-checkbox');
            
            const completed = Array.from(checkboxes).filter(cb => cb.checked).length;
            const total = checkboxes.length;

            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completionRate').textContent = total > 0 ? Math.round(completed / total * 100) + '%' : '0%';

            // 更新进度条
            document.getElementById('completedProgressFill').style.width = (total > 0 ? completed / total * 100 : 0) + '%';
            document.getElementById('rateProgressFill').style.width = (total > 0 ? completed / total * 100 : 0) + '%';
            document.getElementById('totalProgressFill').style.width = '100%';

            // 今日摘要
            document.getElementById('todayTotalTasks').textContent = total;
            document.getElementById('todayCompletedTasks').textContent = completed;
            document.getElementById('todayProgress').textContent = total > 0 ? Math.round(completed / total * 100) + '%' : '0%';

            // 估算完成时间
            if (total > 0) {
                let totalMinutes = 0;
                const scheduleData_temp = scheduleData[dateStr];
                if (scheduleData_temp && scheduleData_temp.cards) {
                    scheduleData_temp.cards.forEach(card => {
                        const match = card.duration.match(/\d+/);
                        if (match) {
                            totalMinutes += parseInt(match[0]);
                        }
                    });
                }
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                document.getElementById('estimatedTime').textContent = `${hours}小时${minutes}分钟`;
            }

            // 连续完成天数
            calculateConsecutiveDays();
        }

        function calculateConsecutiveDays() {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            let consecutiveDays = 0;
            let checkDate = new Date(currentDate);

            while (true) {
                const dateStr = checkDate.toISOString().split('T')[0];
                const scheduleInfo = scheduleData[dateStr];
                
                if (!scheduleInfo) break;

                const taskKeys = [];
                if (scheduleInfo.cards) {
                    scheduleInfo.cards.forEach((card, cardIndex) => {
                        card.tasks.forEach((task, taskIndex) => {
                            taskKeys.push(`${dateStr}-${cardIndex}-${taskIndex}`);
                        });
                    });
                }

                // 检查该天是否全部完成
                const allCompleted = taskKeys.length > 0 && taskKeys.every(key => data[key]);
                if (!allCompleted && taskKeys.length > 0) break;

                consecutiveDays++;
                checkDate.setDate(checkDate.getDate() - 1);
            }

            document.getElementById('consecutiveDays').textContent = consecutiveDays;
            document.getElementById('consecutiveProgressFill').style.width = Math.min(consecutiveDays / 81 * 100, 100) + '%';
        }

        // 指南弹窗
        function showGuide(guideText) {
            document.getElementById('guideText').innerHTML = guideText;
            document.getElementById('guideModal').classList.add('show');
        }

        function closeGuide() {
            document.getElementById('guideModal').classList.remove('show');
        }

        // 日期导航
        let currentDate = new Date().toISOString().split('T')[0];

        function previousDate() {
            const date = new Date(currentDate);
            date.setDate(date.getDate() - 1);
            currentDate = date.toISOString().split('T')[0];
            updateDateDisplay();
            generateSchedule(currentDate);
        }

        function nextDate() {
            const date = new Date(currentDate);
            date.setDate(date.getDate() + 1);
            currentDate = date.toISOString().split('T')[0];
            updateDateDisplay();
            generateSchedule(currentDate);
        }

        function selectDate() {
            const selected = document.getElementById('dateSelector').value;
            if (selected) {
                currentDate = selected;
                updateDateDisplay();
                generateSchedule(currentDate);
            }
        }

        function updateDateDisplay() {
            document.getElementById('dateSelector').value = currentDate;
            const date = new Date(currentDate);
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' };
            document.getElementById('currentDateDisplay').textContent = date.toLocaleDateString('zh-CN', options);
        }

        function resetAll() {
            if (confirm('确定要重置所有进度吗？此操作无法撤销！')) {
                localStorage.removeItem('taskStatus');
                generateSchedule(currentDate);
            }
        }

        function exportData() {
            const data = localStorage.getItem('taskStatus') || '{}';
            const dataStr = JSON.stringify(JSON.parse(data), null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `N1备考数据-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // 关闭弹窗
        window.onclick = function(event) {
            const modal = document.getElementById('guideModal');
            if (event.target === modal) {
                modal.classList.remove('show');
            }
        }

        // 初始化
        window.addEventListener('load', () => {
            updateDateDisplay();
            generateSchedule(currentDate);
        });
    </script>

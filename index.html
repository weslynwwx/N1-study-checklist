<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N1备考打卡系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 2.5em;
            color: #333;
            font-weight: bold;
        }

        .stat-card .progress-bar {
            margin-top: 10px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-card .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls input, .controls select, .controls button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls input, .controls select {
            background: white;
            color: #333;
        }

        .controls button {
            background: #667eea;
            color: white;
            font-weight: bold;
            border: none;
        }

        .controls button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .date-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .date-navigation button {
            width: 50px;
            padding: 12px;
        }

        .current-date {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .schedule-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .schedule-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .schedule-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .schedule-header.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .schedule-content {
            padding: 20px;
        }

        .time-slot {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .time-slot:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .time-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .task-item.completed {
            background: #f0f9ff;
            border-left-color: #38ef7d;
            opacity: 0.8;
        }

        .task-item.completed .task-content {
            text-decoration: line-through;
            color: #999;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .task-content {
            flex: 1;
            cursor: pointer;
        }

        .task-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .task-description {
            color: #666;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .task-duration {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-top: 6px;
        }

        .guide-button {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .guide-button:hover {
            background: #764ba2;
        }

        .guide-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        .guide-modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .guide-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .guide-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .guide-content h3 {
            color: #764ba2;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .guide-content p {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .guide-content ul, .guide-content ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .guide-content li {
            margin-bottom: 8px;
            color: #333;
            line-height: 1.6;
        }

        .guide-step {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .close-guide {
            float: right;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
        }

        .close-guide:hover {
            color: #333;
        }

        .daily-summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: bold;
            color: #667eea;
        }

        .summary-value {
            color: #333;
        }

        .weekend {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .weekend .schedule-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .schedule-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .controls input, .controls select, .controls button {
                width: 100%;
            }

            .guide-content {
                max-width: 90%;
                padding: 20px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 30px;
            opacity: 0.8;
        }

        .export-btn {
            background: #38ef7d !important;
        }

        .export-btn:hover {
            background: #11998e !important;
        }

        .no-data {
            grid-column: 1/-1;
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 N1备考打卡系统</h1>
            <p>坚持81天，通过N1考试！ 加油💪</p>
            <p style="font-size: 0.9em; margin-top: 10px;">考试日期: 2026年12月4日</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>总任务数</h3>
                <div class="number" id="totalTasks">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="totalProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>已完成</h3>
                <div class="number" id="completedTasks">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="completedProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>完成率</h3>
                <div class="number" id="completionRate">0%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="rateProgressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>连续完成天数</h3>
                <div class="number" id="consecutiveDays">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="consecutiveProgressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="date-navigation">
                <button onclick="previousDate()">← 前一天</button>
                <div>
                    <input type="date" id="dateSelector" onchange="selectDate()">
                    <div class="current-date" id="currentDateDisplay">今日</div>
                </div>
                <button onclick="nextDate()">后一天 →</button>
            </div>
            <button onclick="jumpToToday()">📅 回到今天</button>
            <button onclick="resetAll()" style="background: #ff6b6b; border-color: #ff6b6b;">🔄 重置所有</button>
            <button class="export-btn" onclick="exportData()">📊 导出数据</button>
        </div>

        <div class="schedule-container" id="scheduleContainer">
            <!-- 动态生成的日程卡片 -->
        </div>

        <div class="daily-summary">
            <h3 style="color: #667eea; margin-bottom: 15px;">📋 今日任务总结</h3>
            <div class="summary-row">
                <span class="summary-label">总任务数：</span>
                <span class="summary-value" id="todayTotalTasks">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">已完成：</span>
                <span class="summary-value" id="todayCompletedTasks">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">完成进度：</span>
                <span class="summary-value" id="todayProgress">0%</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">预计完成时间：</span>
                <span class="summary-value" id="estimatedTime">-</span>
            </div>
        </div>

        <div class="footer">
            <p>💡 每天坚持打卡，记录学习进度。你的努力终将开花结果！</p>
            <p>© N1备考打卡系统 - 祝你12月4日考试顺利通过！🎯</p>
        </div>
    </div>

    <!-- 指南弹窗 -->
    <div class="guide-modal" id="guideModal">
        <div class="guide-content">
            <span class="close-guide" onclick="closeGuide()">&times;</span>
            <div id="guideText"></div>
        </div>
    </div>

    <script>
        // 生成完整的82天学习计划
        const scheduleData = generateCompletePlan();

        function generateCompletePlan() {
            const plan = {};
            const startDate = new Date('2026-09-14');
            const endDate = new Date('2026-12-04');

            // 阶段一：9月14日-9月30日（17天）
            for (let i = 0; i < 17; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(currentDate.getDate() + i);
                const dateStr = currentDate.toISOString().split('T')[0];
                const dayOfWeek = currentDate.getDay();
                const isWeekend = dayOfWeek === 6;

                const wordDay = i + 1; // 1-17
                const wordStartNum = (wordDay - 1) * 50 + 1;
                const wordEndNum = wordDay * 50;

                const grammarUnit = Math.ceil(wordDay / 1);
                const grammarStartUnit = grammarUnit;
                const grammarEndUnit = grammarUnit;

                const tasks = [];

                // 单词任务
                tasks.push({
                    title: `📖 单词学习：激活必考词第${wordStartNum}-${wordEndNum}词`,
                    description: `在识日APP中激活这50个单词进行学习`,
                    guide: `
                        <h2>APP单词学习指南</h2>
                        <div class="guide-step">
                            <h3>操作步骤</h3>
                            <ol>
                                <li>打开识日APP，进入"必考词2680词"词书</li>
                                <li>APP会自动刷新今日的50个新词（第${wordStartNum}-${wordEndNum}词）</li>
                                <li>逐个点击学习每个词：
                                    <ul>
                                        <li>听发音</li>
                                        <li>看中文意思</li>
                                        <li>记例句</li>
                                    </ul>
                                </li>
                                <li>完成今日50词的学习</li>
                            </ol>
                        </div>
                        <div class="guide-step">
                            <h3>学习方法</h3>
                            <ul>
                                <li>不需要手动录入，APP已自动刷新这50词</li>
                                <li>重点是通过APP完成学习流程</li>
                                <li>每个词大约30-40秒</li>
                                <li>总耗时约30分钟</li>
                            </ul>
                        </div>
                        <div class="guide-step">
                            <h3>艾宾浩斯复习机制</h3>
                            <p>●今日新学的这50词，明日会自动进入APP复习栏</p>
                            <p>●无需手动操作，APP自动安排</p>
                        </div>
                    `
                });

                // APP复习（从第2天开始有）
                if (i > 0) {
                    tasks.push({
                        title: `🔄 APP复习：复习已学词汇`,
                        description: `完成识日APP推送的复习词汇（上限100词）`,
                        guide: `
                            <h2>APP复习指南</h2>
                            <div class="guide-step">
                                <h3>复习原理</h3>
                                <p>●前一天（9月${(new Date(currentDate.getTime() - 86400000)).getDate()}日）新学的词今天进入复习栏</p>
                                <p>●更早前学的词也可能触发复习</p>
                                <p>●APP按照艾宾浩斯算法自动安排</p>
                            </div>
                            <div class="guide-step">
                                <h3>操作步骤</h3>
                                <ol>
                                    <li>打开识日APP，进入"复习"栏</li>
                                    <li>完成APP推送的复习题</li>
                                    <li>对每个词进行"遮住法"测试：
                                        <ul>
                                            <li>看日文，猜中文（无看中文）</li>
                                            <li>点确认查看答案</li>
                                        </ul>
                                    </li>
                                    <li>继续直到达到100词上限</li>
                                </ol>
                            </div>
                            <div class="guide-step">
                                <h3>⚠️ 重要提醒</h3>
                                <p>●复习有100词/天的上限</p>
                                <p>●如果APP推送超过100词，只能完成100词</p>
                                <p>●剩余词汇APP会自动延后</p>
                                <p>●无需手动干预</p>
                            </div>
                        `
                    });
                } else {
                    tasks.push({
                        title: `⏳ 今日无复习任务`,
                        description: `首日新学，APP复习栏为空。用此时段再过一遍新学的词。`,
                        guide: `
                            <h2>首日特殊说明</h2>
                            <div class="guide-step">
                                <h3>为什么首日没有复习？</h3>
                                <p>●APP的艾宾浩斯复习机制：前一天新学 → 次日进入复习栏</p>
                                <p>●9月14日是第一天，之前没有新学的词</p>
                                <p>●所以APP复习栏为空</p>
                            </div>
                            <div class="guide-step">
                                <h3>这40分钟干什么？</h3>
                                <ol>
                                    <li>再次打开APP，查看今日新学的50词</li>
                                    <li>用"遮住法"测试：遮住中文，只看日文，尝试回忆</li>
                                    <li>这是加强第1天印象的最好方法</li>
                                    <li>重点记忆发音和基本意思</li>
                                </ol>
                            </div>
                        `
                    });
                }

                // 语法任务
                const grammarUnits = [];
                if (i === 0) {
                    // 第一天：学第1单元
                    grammarUnits.push('第1单元');
                } else if (i < 14) {
                    // 学第2-14单元
                    const unit = i + 1;
                    grammarUnits.push(`第${unit}单元`);
                    if (i > 0) {
                        grammarUnits.push(`复习第${Math.max(1, i - 3)}-${i}单元`);
                    }
                } else {
                    // 最后几天
                    grammarUnits.push(`第14单元`);
                    grammarUnits.push(`1-14单元总复习`);
                }

                tasks.push({
                    title: `📚 语法学习：N1语法大纲 ${grammarUnits.join(' + ')}`,
                    description: `学习/复习语法大纲内容`,
                    guide: `
                        <h2>N1语法大纲学习指南</h2>
                        <div class="guide-step">
                            <h3>学习流程（50分钟）</h3>
                            <ol>
                                <li>前20分钟：复习前面学过的单元（用遮住法）</li>
                                <li>中20分钟：学习新单元
                                    <ul>
                                        <li>打开《N1语法大纲》</li>
                                        <li>逐条理解每个语法的：
                                            <ul>
                                                <li>接续方式</li>
                                                <li>中文含义</li>
                                                <li>用法规则</li>
                                            </ul>
                                        </li>
                                        <li>看例句，理解语境</li>
                                    </ul>
                                </li>
                                <li>后10分钟：合书自测
                                    <ul>
                                        <li>闭上书本</li>
                                        <li>尝试回忆本单元所有语法点</li>
                                        <li>能想起几个就说几个</li>
                                    </ul>
                                </li>
                            </ol>
                        </div>
                        <div class="guide-step">
                            <h3>学习技巧</h3>
                            <ul>
                                <li>理解优先于背诵</li>
                                <li>手写例句，加强记忆</li>
                                <li>标记难点，后续重点复习</li>
                                <li>不追求一次全记住，多次复习才能掌握</li>
                            </ul>
                        </div>
                        <div class="guide-step">
                            <h3>进度追踪</h3>
                            <p>●今日进度：${grammarStartUnit}-${grammarEndUnit}单元</p>
                            <p>●计划目标：10月7日完成第1-20单元第1轮</p>
                        </div>
                    `
                });

                // 阅读任务（交替安排）
                const readingIndex = i % 2;
                if (readingIndex === 0) {
                    tasks.push({
                        title: `📖 阅读精读：2019/12真题`,
                        description: `选择短篇或中篇进行精读训练`,
                        guide: `
                            <h2>阅读精读四步法</h2>
                            <div class="guide-step">
                                <h3>第1步：通读（3分钟）</h3>
                                <ol>
                                    <li>快速读全文，不查词</li>
                                    <li>标出不认识的词（不停下来查）</li>
                                    <li>理解文章大意</li>
                                </ol>
                            </div>
                            <div class="guide-step">
                                <h3>第2步：做题（2-3分钟）</h3>
                                <ol>
                                    <li>根据文意选择答案</li>
                                    <li>标记不确定的题</li>
                                </ol>
                            </div>
                            <div class="guide-step">
                                <h3>第3步：精读（20分钟）</h3>
                                <ol>
                                    <li>逐句精读全文</li>
                                    <li>查出所有不认识的词，写入生词本</li>

                        <p>●第6周：能跟上70-75%</p>
                        <p>●第8周：能跟上80-85%</p>
                        <p>●第10周：能跟上85-90%，基本流畅</p>
                    </div>
                `,
                '维持': `
                    <h2>影子跟读维持期（第11周-考试前）</h2>
                    <div class="guide-step">
                        <h3>时间分配（30分钟）</h3>
                        <ol>
                            <li>20分钟：跟读已学题目（巩固）</li>
                            <li>10分钟：复习最容易出错的段落</li>
                        </ol>
                    </div>
                    <div class="guide-step">
                        <h3>目标</h3>
                        <p>●保持听力状态</p>
                        <p>●不让能力下降</p>
                        <p>●考前维持最佳状态</p>
                    </div>
                    <div class="guide-step">
                        <h3>预期效果</h3>
                        <p>●完全流畅，接近原音</p>
                        <p>●考场上听力理解速度明显提升</p>
                    </div>
                `
            };
            return guides[stage] || '';
        }

        // 生成日程卡片
        function generateSchedule(dateStr) {
            const scheduleContainer = document.getElementById('scheduleContainer');
            scheduleContainer.innerHTML = '';

            const data = scheduleData[dateStr];
            if (!data) {
                scheduleContainer.innerHTML = '<p class="no-data">此日期无计划数据</p>';
                return;
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = `schedule-card ${data.isWeekend ? 'weekend' : ''}`;

            const headerDiv = document.createElement('div');
            headerDiv.className = 'schedule-header';
            headerDiv.textContent = `${data.period} - ${data.title}`;
            cardDiv.appendChild(headerDiv);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'schedule-content';

            // 添加任务列表
            data.tasks.forEach((task, taskIndex) => {
                const taskKey = `${dateStr}-${taskIndex}`;
                const isCompleted = getTaskStatus(taskKey);

                const taskItem = document.createElement('div');
                taskItem.className = `task-item ${isCompleted ? 'completed' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.checked = isCompleted;
                checkbox.onchange = () => toggleTask(taskKey);

                const taskContent = document.createElement('div');
                taskContent.className = 'task-content';

                const taskTitle = document.createElement('div');
                taskTitle.className = 'task-title';
                taskTitle.textContent = task.title;

                const taskDesc = document.createElement('div');
                taskDesc.className = 'task-description';
                taskDesc.textContent = task.description;

                taskContent.appendChild(taskTitle);
                taskContent.appendChild(taskDesc);

                if (task.guide) {
                    const guideBtn = document.createElement('button');
                    guideBtn.className = 'guide-button';
                    guideBtn.textContent = '📖 查看指南';
                    guideBtn.onclick = (e) => {
                        e.stopPropagation();
                        showGuide(task.guide);
                    };
                    taskContent.appendChild(guideBtn);
                }

                taskItem.appendChild(checkbox);
                taskItem.appendChild(taskContent);
                contentDiv.appendChild(taskItem);
            });

            cardDiv.appendChild(contentDiv);
            scheduleContainer.appendChild(cardDiv);

            updateStats(dateStr);
        }

        // 任务状态管理
        function getTaskStatus(taskKey) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            return data[taskKey] || false;
        }

        function toggleTask(taskKey) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            data[taskKey] = !data[taskKey];
            localStorage.setItem('taskStatus', JSON.stringify(data));
            generateSchedule(currentDate);
        }

        function updateStats(dateStr) {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            const scheduleContainer = document.getElementById('scheduleContainer');
            const checkboxes = scheduleContainer.querySelectorAll('.task-checkbox');
            
            const completed = Array.from(checkboxes).filter(cb => cb.checked).length;
            const total = checkboxes.length;

            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completionRate').textContent = total > 0 ? Math.round(completed / total * 100) + '%' : '0%';

            // 更新进度条
            document.getElementById('completedProgressFill').style.width = (total > 0 ? completed / total * 100 : 0) + '%';
            document.getElementById('rateProgressFill').style.width = (total > 0 ? completed / total * 100 : 0) + '%';
            document.getElementById('totalProgressFill').style.width = '100%';

            // 今日摘要
            document.getElementById('todayTotalTasks').textContent = total;
            document.getElementById('todayCompletedTasks').textContent = completed;
            document.getElementById('todayProgress').textContent = total > 0 ? Math.round(completed / total * 100) + '%' : '0%';

            // 估算完成时间
            if (total > 0) {
                const scheduleInfo = scheduleData[dateStr];
                let totalMinutes = 0;
                if (scheduleInfo && scheduleInfo.tasks) {
                    scheduleInfo.tasks.forEach(task => {
                        // 估算每个任务时间
                        if (task.title.includes('单词')) totalMinutes += 30;
                        else if (task.title.includes('APP复习')) totalMinutes += 40;
                        else if (task.title.includes('语法')) totalMinutes += 50;
                        else if (task.title.includes('阅读')) totalMinutes += 120;
                        else if (task.title.includes('听力')) totalMinutes += 60;
                        else if (task.title.includes('影子跟读')) totalMinutes += 30;
                    });
                }
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                document.getElementById('estimatedTime').textContent = `${hours}小时${minutes}分钟`;
            }

            // 连续完成天数
            calculateConsecutiveDays();
        }

        function calculateConsecutiveDays() {
            const data = JSON.parse(localStorage.getItem('taskStatus') || '{}');
            let consecutiveDays = 0;
            let checkDate = new Date(currentDate);

            while (true) {
                const dateStr = checkDate.toISOString().split('T')[0];
                const scheduleInfo = scheduleData[dateStr];
                
                if (!scheduleInfo) break;

                const taskKeys = [];
                if (scheduleInfo.tasks) {
                    scheduleInfo.tasks.forEach((task, taskIndex) => {
                        taskKeys.push(`${dateStr}-${taskIndex}`);
                    });
                }

                // 检查该天是否全部完成
                const allCompleted = taskKeys.length > 0 && taskKeys.every(key => data[key]);
                if (!allCompleted && taskKeys.length > 0) break;

                consecutiveDays++;
                checkDate.setDate(checkDate.getDate() - 1);
            }

            document.getElementById('consecutiveDays').textContent = consecutiveDays;
            document.getElementById('consecutiveProgressFill').style.width = Math.min(consecutiveDays / 81 * 100, 100) + '%';
        }

        // 指南弹窗
        function showGuide(guideText) {
            document.getElementById('guideText').innerHTML = guideText;
            document.getElementById('guideModal').classList.add('show');
        }

        function closeGuide() {
            document.getElementById('guideModal').classList.remove('show');
        }

        // 日期导航
        let currentDate = new Date().toISOString().split('T')[0];

        function previousDate() {
            const date = new Date(currentDate);
            date.setDate(date.getDate() - 1);
            currentDate = date.toISOString().split('T')[0];
            updateDateDisplay();
            generateSchedule(currentDate);
        }

        function nextDate() {
            const date = new Date(currentDate);
            date.setDate(date.getDate() + 1);
            currentDate = date.toISOString().split('T')[0];
            updateDateDisplay();
            generateSchedule(currentDate);
        }

        function selectDate() {
            const selected = document.getElementById('dateSelector').value;
            if (selected) {
                currentDate = selected;
                updateDateDisplay();
                generateSchedule(currentDate);
            }
        }

        function jumpToToday() {
            currentDate = new Date().toISOString().split('T')[0];
            updateDateDisplay();
            generateSchedule(currentDate);
        }

        function updateDateDisplay() {
            document.getElementById('dateSelector').value = currentDate;
            const date = new Date(currentDate + 'T00:00:00');
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' };
            document.getElementById('currentDateDisplay').textContent = date.toLocaleDateString('zh-CN', options);
        }

        function resetAll() {
            if (confirm('确定要重置所有进度吗？此操作无法撤销！')) {
                localStorage.removeItem('taskStatus');
                generateSchedule(currentDate);
            }
        }

        function exportData() {
            const data = localStorage.getItem('taskStatus') || '{}';
            const dataStr = JSON.stringify(JSON.parse(data), null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `N1备考数据-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // 关闭弹窗
        window.onclick = function(event) {
            const modal = document.getElementById('guideModal');
            if (event.target === modal) {
                modal.classList.remove('show');
            }
        }

        // 初始化
        window.addEventListener('load', () => {
            updateDateDisplay();
            // 检查日期是否有效
            if (scheduleData[currentDate]) {
                generateSchedule(currentDate);
            } else {
                // 如果今天没有计划，用最近的一个有计划的日期
                const firstDate = '2026-09-14';
                currentDate = firstDate;
                updateDateDisplay();
                generateSchedule(currentDate);
            }
        });
    </script>
</body>
</html>
